version: "3.9"

# --- Định nghĩa Mạng (Network) ---
networks:
  camera_shop_network:
    driver: bridge

# --- Định nghĩa Volume ---
volumes:
  mysql_data:
    driver: local

services:
  # --- Dịch vụ Database ---
  db:
    image: mysql:8.0
    container_name: camera-shop-db
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--log-bin-trust-function-creators=1"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "7777:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - camera_shop_network

  # --- Dịch vụ Redis (Cho Caching và Celery) ---
  redis:
    image: "redis:7-alpine"
    container_name: camera-shop-redis
    ports:
      - "6379:6379"
    networks:
      - camera_shop_network

  # --- Dịch vụ Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: camera-shop-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - camera_shop_network

  # --- Dịch vụ Celery Worker (Xử lý tác vụ nền) ---
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: camera-shop-celery-worker
    # !!! THAY ĐỔI QUAN TRỌNG Ở ĐÂY !!!
    # Trỏ đúng vào biến `celery_app` trong file `app/celery_worker.py`
    command: celery -A app.celery_worker:celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    networks:
      - camera_shop_network

  # --- Dịch vụ Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: camera-shop-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - camera_shop_network
