version: "3.9"

networks:
  camera_shop_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

services:
  db:
    image: mysql:8.0
    container_name: camera-shop-db
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--log-bin-trust-function-creators=1"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "7777:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - camera_shop_network

  redis:
    image: "redis:7-alpine"
    container_name: camera-shop-redis
    ports:
      - "6379:6379"
    networks:
      - camera_shop_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: camera-shop-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    command: flask run --host=0.0.0.0 --port=5000
    depends_on:
      - db
      - redis
    networks:
      - camera_shop_network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: camera-shop-celery-worker
    command: celery -A app.celery_worker:celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    networks:
      - camera_shop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: camera-shop-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - camera_shop_network
